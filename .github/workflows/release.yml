name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, X.Y.Z (no leading v)
        type: string
        required: true
      dry_run:
        description: Run every check but do not tag or publish
        type: boolean
        default: true
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # contents: write only to push the tag on the dispatch path.
    permissions:
      contents: write
    outputs:
      version: ${{ steps.check.outputs.version }}
      sha: ${{ steps.check.outputs.sha }}
      latest: ${{ steps.check.outputs.latest }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
          fetch-depth: 0

      - name: Check and tag
        id: check
        env:
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ]; then
            checked=$(python3 scripts/release_check.py --version "$VERSION") || { echo "$checked"; exit 1; }
            version=$VERSION
          else
            checked=$(python3 scripts/release_check.py --tag "$REF_NAME") || { echo "$checked"; exit 1; }
            version=${REF_NAME#v}
          fi
          echo "$checked"
          sha=$(git rev-parse HEAD)
          publish=true
          if [ "$EVENT" = workflow_dispatch ]; then
            if [ "$DRY_RUN" = false ]; then
              # A tag pushed with GITHUB_TOKEN starts no workflow, so this run publishes itself.
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag -a "v$version" -m "v$version"
              git push origin "v$version"
            else
              publish=false
            fi
          fi
          {
            echo "version=$version"
            echo "sha=$sha"
            echo "publish=$publish"
            echo "$checked" | grep '^latest='
          } >> "$GITHUB_OUTPUT"

  image:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: privacyfence-cockpit:smoke
          build-args: VERSION=${{ needs.prepare.outputs.version }}

      - name: Smoke test
        run: scripts/smoke_image.sh privacyfence-cockpit:smoke

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: tags
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          LATEST: ${{ needs.prepare.outputs.latest }}
        run: |
          set -euo pipefail
          image=ghcr.io/privacyfence/privacyfence-cockpit
          {
            echo "list<<EOF"
            echo "$image:$VERSION"
            echo "$image:${VERSION%.*}"
            if [ "$LATEST" = true ]; then echo "$image:latest"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ needs.prepare.outputs.version }}
          tags: ${{ steps.tags.outputs.list }}

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/privacyfence/privacyfence-cockpit
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Summary
        env:
          TAGS: ${{ steps.tags.outputs.list }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Published"
            echo
            echo "$TAGS" | sed 's/^/- `/; s/$/`/'
            echo
            echo "Digest: \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
