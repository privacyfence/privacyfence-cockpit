[build-system]
requires = ["setuptools>=61", "wheel", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "privacyfence-cockpit"
dynamic = ["version"]
description = "A container that runs privacyfence-sync recipes on a schedule, with a web dashboard."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "starlette>=1.9,<2",
  "jinja2>=3.1.6,<4",
  "uvicorn>=0.54,<1",
  "python-multipart>=0.0.32",
  "croniter>=6.2,<7",
  "pyyaml>=6.0.3,<7",
  "cryptography>=50",
  "mcp>=2.3,<3",
  "httpx2>=2.15",
]

[project.optional-dependencies]
test = ["pytest", "pytest-cov", "pytest-asyncio", "httpx"]
dev = ["ruff", "mypy", "bandit", "types-PyYAML", "types-croniter"]

[project.scripts]
cockpit = "privacyfence_cockpit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
privacyfence_cockpit = ["py.typed", "web/templates/*.html", "web/static/*"]

[tool.setuptools_scm]
fallback_version = "0.0.0.dev0"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S103", "S105", "S106", "S108", "S603", "S607"]

[tool.mypy]
strict = true
files = ["src"]

[tool.bandit]
exclude_dirs = ["tests"]
