[build-system]
requires = ["setuptools>=61", "wheel", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "privacyfence-cockpit"
dynamic = ["version"]
description = "A container that runs privacyfence-sync recipes on a schedule, with a web dashboard."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
test = ["pytest", "pytest-cov", "pytest-asyncio"]
dev = ["ruff", "mypy", "bandit"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
privacyfence_cockpit = ["py.typed"]

[tool.setuptools_scm]
fallback_version = "0.0.0.dev0"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src"]

[tool.bandit]
exclude_dirs = ["tests"]
